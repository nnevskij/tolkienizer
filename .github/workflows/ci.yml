name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install curl cjson pkg-config

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev pkg-config

    - name: Build tolkienizer
      run: |
        make clean
        make

    - name: Test CLI flags
      run: |
        ./tolkienizer --version
        ./tolkienizer --help
        ./tolkienizer --list-styles
        ./tolkienizer --show-config
